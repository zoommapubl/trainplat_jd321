[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zoommapubl-trainplat_jd321"
version = "0.1.0"
description = "从输入中抽取数值，计算大模型训练平台工程师·存储 IO 与计算的重叠相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zoommapubl" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://zoommapubl.github.io"
Repository = "https://github.com/zoommapubl/trainplat_jd321"
Issues = "https://github.com/zoommapubl/trainplat_jd321/issues"

[project.scripts]
trainplat_jd321 = "trainplat_jd321:main"

[tool.setuptools]
py-modules = ["trainplat_jd321"]
